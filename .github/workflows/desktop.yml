name: desktop

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["desktop/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Syntax check
        run: Get-ChildItem -Recurse -Filter *.js src, scripts | ForEach-Object { node --check $_.FullName }
      - name: Build installer
        run: npm run dist:win
      - uses: actions/upload-artifact@v7
        with:
          name: cpxo-windows
          path: desktop/dist/cpxo-setup-*.exe

  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned build; see desktop/README.md
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Build dmg (Apple Silicon + Intel)
        run: npm run dist:mac
      - run: ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: cpxo-mac
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip

  release:
    needs: [windows, mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - run: ls -R assets
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/cpxo-windows/*.exe
            assets/cpxo-mac/*.dmg
            assets/cpxo-mac/*.zip
          generate_release_notes: true
