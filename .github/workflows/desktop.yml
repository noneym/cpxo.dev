name: desktop

on:
  push:
    branches: [main]
    paths: ["desktop/**", "siyuan/**", ".github/workflows/desktop.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["desktop/**", "siyuan/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Syntax check
        run: Get-ChildItem -Recurse -Filter *.js src, scripts | ForEach-Object { node --check $_.FullName }
      - name: Build installer
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: cpxo-windows
          path: |
            desktop/dist/cpxo-setup-*.exe
            desktop/dist/cpxo-setup-*.exe.blockmap
            desktop/dist/latest.yml

  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    env:
      # Developer ID signing + notarization. When the secrets are missing (forks),
      # electron-builder skips signing and scripts/afterPack.js ad-hoc signs instead.
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Build dmg (Apple Silicon + Intel), sign and notarize
        run: |
          set -o pipefail
          if ! npm run dist:mac 2>&1 | tee build.log; then
            echo "::error title=dist:mac failed::$(grep -iE 'error|fail|notariz|identity|keychain|codesign' build.log | grep -v 'npm ERR' | tail -n 12 | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          fi
          grep -iE 'signing|notariz|identity|skipped' build.log | head -n 20 | while read -r l; do echo "::notice title=sign::$l"; done
      - name: Verify signature
        run: |
          ls -la dist
          for app in dist/mac*/cpxo.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=2 "$app" || echo "::warning::$app is not notarized (no certificate secrets?)"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cpxo-mac
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/latest-mac.yml

  siyuan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: siyuan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: siyuan/package-lock.json
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - name: Build plugin zip
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: cpxo-siyuan
          path: siyuan/dist/cpxo-siyuan-*.zip

  release:
    needs: [windows, mac, siyuan]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - run: ls -R assets
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/cpxo-windows/*.exe
            assets/cpxo-windows/*.blockmap
            assets/cpxo-windows/latest.yml
            assets/cpxo-mac/*.dmg
            assets/cpxo-mac/*.zip
            assets/cpxo-mac/*.blockmap
            assets/cpxo-mac/latest-mac.yml
            assets/cpxo-siyuan/*.zip
          generate_release_notes: true
