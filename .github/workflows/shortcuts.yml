name: shortcuts

on:
  push:
    branches: [main]
    paths: ["shortcuts/**", ".github/workflows/shortcuts.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned shortcuts
        run: python3 shortcuts/build.py
      - name: Sign for anyone
        run: |
          mkdir -p signed
          sw_vers | tr '\n' ' '; echo
          shortcuts --help 2>&1 | head -5 || true
          rc=0
          for f in shortcuts/*.shortcut; do
            name=$(basename "$f")
            plutil -lint "$f" 2>&1 | while read -r l; do echo "::notice title=plutil $name::$l"; done
            if shortcuts sign --mode anyone --input "$f" --output "signed/$name" 2>err.txt; then
              echo "::notice title=signed $name::$(ls -l "signed/$name" | awk '{print $5}') bytes, magic $(head -c 4 "signed/$name" | xxd -p)"
            else
              rc=1
              echo "::error title=shortcuts sign $name::$(tr '\n' ' ' < err.txt | cut -c1-900)"
            fi
          done
          exit $rc
      - uses: actions/upload-artifact@v4
        with:
          name: shortcuts-signed
          path: signed/*.shortcut
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: signed/*.shortcut
