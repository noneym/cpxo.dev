name: shortcuts

on:
  push:
    branches: [main]
    paths: ["shortcuts/**", ".github/workflows/shortcuts.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned shortcuts
        run: python3 shortcuts/build.py
      - name: Sign for anyone
        run: |
          mkdir -p signed
          for f in shortcuts/*.shortcut; do
            name=$(basename "$f")
            plutil -lint "$f"
            shortcuts sign --mode anyone --input "$f" --output "signed/$name"
            ls -l "signed/$name"
            head -c 4 "signed/$name" | xxd
          done
      - uses: actions/upload-artifact@v4
        with:
          name: shortcuts-signed
          path: signed/*.shortcut
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: signed/*.shortcut
