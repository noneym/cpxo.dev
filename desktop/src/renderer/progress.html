<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file:;">
  <title>cpxo upload</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: #0B0D10; color: #F3F2EC;
      font: 12.5px/1.4 "Segoe UI", system-ui, sans-serif;
      user-select: none; overflow: hidden;
    }
    body { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid #262B33; }
    img { flex: none; display: block; }
    .text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .row { display: flex; justify-content: space-between; gap: 10px; }
    .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pct { color: #9AA3AD; font-family: Consolas, "Cascadia Mono", monospace; font-size: 11.5px; flex: none; }
    .bar { height: 4px; background: #1D2128; border-radius: 2px; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 0; background: #F3F2EC; transition: width 150ms linear; }
    .bytes { color: #9AA3AD; font-family: Consolas, "Cascadia Mono", monospace; font-size: 11px; }
  </style>
</head>
<body>
  <img src="../../assets/mark.svg" alt="" width="28" height="28">
  <div class="text">
    <div class="row"><span class="name" id="name">Uploading</span><span class="pct" id="pct">0%</span></div>
    <div class="bar"><i id="fill"></i></div>
    <div class="bytes" id="bytes"></div>
  </div>
  <script src="progress.js"></script>
</body>
</html>
